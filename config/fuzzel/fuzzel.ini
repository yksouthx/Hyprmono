# HyprMono application launcher (fuzzel), monochrome to match Caffyne Shell.
# Colors are RRGGBBAA. Reference: man fuzzel.ini
[main]
font=NType82Mono:size=12
prompt="> "
lines=10
width=36
horizontal-pad=24
vertical-pad=14
inner-pad=10
icons-enabled=yes
layer=overlay

[colors]
background=101010f5
text=e0e0e0ff
prompt=a0a0a0ff
match=ffffffff
selection=333333ff
selection-text=ffffffff
selection-match=ffffffff
border=8a8a8aff

[border]
width=1
radius=12
