# HyprMono application launcher (fuzzel), monochrome to match Caffyne Shell.
# Colors are RRGGBBAA. Reference: man fuzzel.ini
[main]
font=NType82Mono:size=12
prompt="> "
lines=10
width=36
horizontal-pad=24
vertical-pad=14
inner-pad=10
icons-enabled=yes
layer=overlay

[colors]
background=0a0a0af2
text=c8c8c8ff
prompt=8a8a8aff
match=ffffffff
selection=242424ff
selection-text=ffffffff
selection-match=ffffffff
border=4a4a4aff

[border]
width=1
radius=10
