windowrulev2 = border_size 3, match:float 0, match:workspace w[tv1]
windowrulev2 = rounding 0, match:float 0, match:workspace w[tv1]

# no-gaps-f1
windowrulev2 = border_size 3, match:float 0, match:workspace f[1]
windowrulev2 = rounding 0, match:float 0, match:workspace f[1]

# suppress-maximize-events
windowrulev2 = suppress_event maximize, match:class .*

# fix-xwayland-drags
windowrulev2 = nofocus, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
