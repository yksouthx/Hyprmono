# windowrules.conf — per-window rules
# Native translation of hyprland/windowsrule.lua.
# hl.window_rule({match={...}, ...props}) -> windowrule = prop1 val1, prop2 val2, match1:val1, match2:val2

# no-gaps-wtv1 / no-gaps-f1 — Hyprland's documented "smart gaps" recipe:
# remove border/rounding when a workspace has exactly one tiled window.
# windowrule allows only one effect per line (the previous version packed
# bordersize+rounding into one line, which is invalid), and the match
# field is "onworkspace:", not "workspace:" — the latter isn't a
# recognized match key and broke parsing of the whole line. Also using
# floating:0 (not :1): the recipe targets the lone *tiled* window.
windowrule = bordersize 3, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]

# no-gaps-f1
windowrule = bordersize 3, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]

# suppress-maximize-events
windowrule = suppressevent maximize, class:.*

# fix-xwayland-drags
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# move-hyprland-run
windowrule = move 20 monitor_h-120, float, class:hyprland-run
