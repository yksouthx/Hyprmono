windowrule = border_size: 3, floating:1, onworkspace:w[tv1]
windowrule = rounding: 0, floating:1, onworkspace:w[tv1]

# no-gaps-f1
windowrule = border_size: 3, floating:1, onworkspace:f[1]
windowrule = rounding: 0, floating:1, onworkspace:f[1]

# suppress-maximize-events
windowrule = suppress-event maximize, class:.*

# fix-xwayland-drags
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# move-hyprland-run
windowrule = move 20 monitor_h-120, float, class:hyprland-run
