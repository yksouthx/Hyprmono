# autostart.conf — startup applications
# Native translation of hyprland/autostart.lua. hl.on("hyprland.start", fn) -> exec-once=
#
# Two bugs were found and corrected here, not present elsewhere in this repo:
#  1. "~/.config/tsumiki/init.sh -start" referenced a script that does not
#     exist anywhere in this repo (leftover from an unrelated base config).
#     Removed rather than guessed at.
#  2. waybar was launched with config path ~/.config/hypr/waybar/{config,style.css},
#     but the actual files in this repo live at ~/.config/waybar/config.jsonc
#     and ~/.config/waybar/style.css. Corrected.
#  3. An unresolved merge conflict here offered a choice between "hyprpaper"
#     and "swww-daemon". swww-daemon was kept: scripts/change_wallpaper.sh
#     and the shipped wallpapers under ~/.config/swww/wallpapers only work
#     with swww, and config/hypr/hyprpaper/hyprpaper.conf pointed at a
#     wallpaper.jpg that doesn't exist anywhere in this repo. The dead
#     hyprpaper config has been removed accordingly.

exec-once = nm-applet --indicator
exec-once = swww-daemon
exec-once = hypridle
exec-once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
