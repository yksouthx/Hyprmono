# HyprMono notification daemon (fnott), monochrome to match the Quickshell bar.
# Colors are RRGGBBAA. Reference: man fnott.ini
[main]
anchor=top-right
stacking-order=top-down
min-width=320
max-width=420
max-height=180
# The bar is 52px tall; keep notifications clear of it.
edge-margin-vertical=62
edge-margin-horizontal=12
notification-margin=8
icon-theme=hicolor
max-icon-size=40
dpi-aware=no

background=0a0a0af2
border-color=4a4a4aff
border-size=1
border-radius=10
padding-vertical=14
padding-horizontal=16

title-font=NType82Mono:size=9
title-color=8a8a8aff
summary-font=NType82Mono:size=11
summary-color=f0f0f0ff
body-font=NType82Mono:size=10
body-color=c8c8c8ff

progress-bar-height=6
progress-color=d8d8d8ff

default-timeout=6

[low]
background=0a0a0ad9
title-color=6a6a6aff
summary-color=a0a0a0ff
body-color=8a8a8aff
default-timeout=4

[critical]
background=141414ff
border-color=ffffffff
border-size=2
default-timeout=0
