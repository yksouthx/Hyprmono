name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install lint and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck lua5.4 qt6-declarative-dev-tools

      - name: Run test suite
        run: |
          status=0
          for test_file in tests/test-*.sh; do
            echo "::group::$test_file"
            bash "$test_file" || status=1
            echo "::endgroup::"
          done
          exit "$status"
